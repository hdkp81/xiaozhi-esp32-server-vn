services:
  xiaozhi-esp32-server-db:
    image: mysql:8.0
    container_name: xiaozhi-esp32-server-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: xiaozhi_esp32_server
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    #ports:
      #- "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      #test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p123456 || exit 1"]
      test: ["CMD-SHELL", "mysql -u root -p123456 -e 'SELECT 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

  xiaozhi-esp32-server-redis:
    image: redis:alpine
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  xiaozhi-esp32-server-web:
    #image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:web_latest
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: xiaozhi-esp32-server-web
    restart: always
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_DRUID_USERNAME: root
      SPRING_DATASOURCE_DRUID_PASSWORD: "123456"
      SPRING_DATA_REDIS_HOST: xiaozhi-esp32-server-redis
      SPRING_DATA_REDIS_PORT: 6379
    #18/8/2026
    volumes:
      - ../manager-web/dist:/usr/share/nginx/html:ro
      - ../manager-web/dist:/usr/share/nginx/html

  xiaozhi-esp32-server:
    #image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: always
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8003:8003"
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Sửa triệt để lỗi mã hóa tiếng Việt
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LANGUAGE: vi
      LC_ALL: C.UTF-8
      # IP của máy chủ trong mạng LAN
      SERVER_HOST: 192.168.1.72
      WEBSOCKET_HOST: 192.168.1.72
    volumes:
      # Chuẩn hóa đường dẫn data
      - ./data:/opt/xiaozhi-esp32-server/data
      # Models Local
      - ./models/Qwen3:/opt/xiaozhi-esp32-server/models/Qwen3
      - ./models/Kokoro:/opt/xiaozhi-esp32-server/models/Kokoro
      - ./models/vad:/opt/xiaozhi-esp32-server/models/vad
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt